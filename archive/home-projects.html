    <!-- Video playlists — cycle through data-playlist sources -->
    <script>
        document.querySelectorAll('video[data-playlist]').forEach(v => {
            const items = v.dataset.playlist.split(',').map(s => s.trim()).filter(Boolean);
            if (!items.length) return;
            let idx = 0;
            v.src = items[0];
            v.addEventListener('ended', () => {
                idx = (idx + 1) % items.length;
                v.src = items[idx];
                v.play().catch(() => {});
            });
        });
    </script>

    <!-- Playground showreel — crossfade-cut between personal clips -->
    <script>
        document.querySelectorAll('.pg-reel').forEach(reel => {
            const clips = [
                './assets/personal/fish_bot.mp4',
                './assets/personal/cubickworld_2.mp4',
                './assets/personal/robot_360.mp4',
                './assets/personal/robot_withEffects.mp4',
            ];
            const layers = reel.querySelectorAll('.reel-vid');
            if (layers.length < 2) return;

            // Single clip: the HTML video already has src + autoplay + loop, so it
            // plays natively (seamless, no crossfade flash / dark gap). Here we just
            // pause it while off-screen and resume when it scrolls back in.
            if (clips.length <= 1) {
                const v = layers[0];
                v.loop = true;
                v.classList.add('is-current');
                layers[1].classList.remove('is-current');
                const io1 = new IntersectionObserver(es => es.forEach(e => {
                    if (e.isIntersecting) { const p = v.play(); if (p) p.catch(() => {}); }
                    else v.pause();
                }), { threshold: 0.4 });
                io1.observe(reel);
                return;
            }

            const FADE = 700;   // must match the CSS opacity transition (ms)
            let cur = 0;        // visible layer (0 or 1)
            let idx = 0;        // clip currently visible
            let switching = false;
            let inView = false;

            const setSrc = (layer, src) => {
                if (!layer.src.endsWith(src.replace('./', ''))) { layer.src = src; layer.load(); }
            };

            // Resolve once the clip's first frame is actually DECODED. A hidden
            // (opacity:0) video won't reliably paint via rVFC, so we wait on the
            // data being ready — that's what kills the black flash.
            const whenReady = video => new Promise(resolve => {
                if (video.readyState >= 2 /* HAVE_CURRENT_DATA */) { resolve(); return; }
                const on = () => {
                    video.removeEventListener('loadeddata', on);
                    video.removeEventListener('canplay', on);
                    resolve();
                };
                video.addEventListener('loadeddata', on);
                video.addEventListener('canplay', on);
                setTimeout(resolve, 600); // hard cap so we never stall
            });

            // Prime both layers: clip 0 visible, clip 1 buffered behind it
            setSrc(layers[0], clips[0]);
            setSrc(layers[1], clips[1 % clips.length]);
            layers[0].classList.add('is-current');
            layers[0].style.zIndex = '2';
            layers[1].classList.remove('is-current');
            layers[1].style.zIndex = '1';

            // Advance to the next clip in the list — wraps around so every clip
            // plays, one after another, forever.
            function advance() {
                if (switching || !inView) return;
                switching = true;

                const next = 1 - cur;
                const nextIdx = (idx + 1) % clips.length;
                const v = layers[next];
                setSrc(v, clips[nextIdx]);
                try { v.currentTime = 0; } catch (e) {}

                // Wait for the next clip's first frame to be decoded, start it,
                // give the compositor two frames to actually present that frame,
                // THEN crossfade. The outgoing clip stays visible underneath the
                // whole time, so there is never a black gap.
                whenReady(v).then(() => {
                    const p = v.play();
                    if (p) p.catch(() => {});
                    // incoming on top, fully opaque outgoing stays underneath during the fade
                    layers[next].style.zIndex = '2';
                    layers[cur].style.zIndex = '1';
                    requestAnimationFrame(() => requestAnimationFrame(() => {
                        layers[next].classList.add('is-current');
                        const prev = cur;
                        cur = next;
                        idx = nextIdx;

                        setTimeout(() => {
                            // now hide the outgoing clip (it's underneath, so no flash)
                            layers[prev].classList.remove('is-current');
                            layers[prev].pause();
                            // Queue the following clip into the now-hidden layer
                            // and pre-decode its first frame so the next cut is clean
                            setSrc(layers[prev], clips[(idx + 1) % clips.length]);
                            try { layers[prev].load(); } catch (e) {}
                            switching = false;
                        }, FADE + 60);
                    }));
                }).catch(() => { switching = false; });
            }

            layers.forEach(v => {
                // Safety net: if the clip reaches its end, move on regardless
                v.addEventListener('ended', () => { if (v.classList.contains('is-current')) advance(); });
                v.addEventListener('timeupdate', () => {
                    if (!v.classList.contains('is-current')) return;
                    // Kick off the crossfade early so it lands right as the clip ends
                    if (v.duration && v.currentTime > v.duration - (FADE / 1000) - 0.15) advance();
                });
            });

            // Only run the reel while the slide is on screen
            const io = new IntersectionObserver(entries => {
                entries.forEach(e => {
                    inView = e.isIntersecting;
                    if (inView) {
                        const p = layers[cur].play();
                        if (p) p.catch(() => {});
                    } else {
                        layers.forEach(l => l.pause());
                    }
                });
            }, { threshold: 0.4 });
            io.observe(reel);
        });
    </script>
